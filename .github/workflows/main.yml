name: Build cpuinfo_spoof r5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk:android13-5.15
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Check required repository files
        run: |
          set -eu
          missing=0
          for file in cpuinfo_spoof.c kirin9020.h Makefile fix_vermagic.py verify_module.py test_build_tools.py cpu_test.sh; do
            if [ ! -s "$file" ]; then
              echo "::error::Missing or empty repository-root file: $file"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo 'Upload ALL files from the extracted upload directory beside Makefile; retain .github/workflows/build.yml.'
            echo 'Repository root contents:'
            ls -la
            exit 1
          fi
      - name: Test build tools
        run: python3 test_build_tools.py -v
      - name: Build with callback type assertions
        run: |
          set -eu
          make
          test -s cpuinfo_spoof.ko
      - name: Fix vermagic
        run: |
          python3 fix_vermagic.py cpuinfo_spoof.ko
      - name: Transfer unverified build to verification job
        uses: actions/upload-artifact@v4
        with:
          name: intermediate-unverified-do-not-load
          retention-days: 1
          if-no-files-found: error
          path: cpuinfo_spoof.ko

  verify:
    needs: build
    runs-on: ubuntu-24.04
    # No DDK container here: setup-python supplies Python and pip on the runner.
    steps:
      - uses: actions/checkout@v4
      - name: Set up verification Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download compiled module
        uses: actions/download-artifact@v4
        with:
          name: intermediate-unverified-do-not-load
          path: verified-artifact
      - name: Install ELF analysis library on verification runner
        run: python -m pip install pyelftools==0.33
      - name: Verify revision and callback ABI
        run: |
          set -eu
          python test_build_tools.py -v
          python verify_module.py verified-artifact/cpuinfo_spoof.ko --output verified-artifact/build_report.json
          cp cpu_test.sh verified-artifact/cpu_test.sh
      - name: Upload verified deliverables only after checks pass
        uses: actions/upload-artifact@v4
        with:
          name: cpuinfo_spoof-r5
          if-no-files-found: error
          path: |
            verified-artifact/cpuinfo_spoof.ko
            verified-artifact/build_report.json
            verified-artifact/cpu_test.sh
